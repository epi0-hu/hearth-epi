name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack hearth.zip
        run: |
          if [ -f hearth.zip ]; then
            rm -rf /tmp/unz && mkdir /tmp/unz && unzip -q -o hearth.zip -d /tmp/unz
            src=/tmp/unz; [ -d /tmp/unz/hearth ] && src=/tmp/unz/hearth
            rm -rf "$src/.github"
            cp -a "$src"/. .
            git rm -q --cached hearth.zip && rm -f hearth.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Unpack hearth.zip" && git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk hearth.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hearth.apk --title "Latest build" --notes "Built from ${GITHUB_SHA::7}" --prerelease
